<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 490" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Bench wiring for the client STIM board session</title><desc>Xantrex rails through two ammeters to J3, DG1022 to J4, load fixture on J1/J2, DHO804 probes on five test loops, laptop on USB to scope and generator.</desc><style>
