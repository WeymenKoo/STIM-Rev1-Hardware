iddle" dominant-baseline="central">Micro-Fit 1/2/3</text></g><g class="c-teal"><rect x="380" y="186" width="100" height="44" rx="6" stroke-width="0.5"/><text class="th" x="430.0" y="199.0" text-anchor="middle" dominant-baseline="central">J4 input</text><text class="ts" x="430.0" y="218.0" text-anchor="middle" dominant-baseline="central">BNC</text></g><g class="c-gray"><rect x="380" y="250" width="100" height="44" rx="6" stroke-width="0.5"/><text class="th" x="430.0" y="263.0" text-anchor="middle" dominant-baseline="central">J1 / J2</text><text class="ts" x="430.0" y="282.0" text-anchor="middle" dominant-baseline="central">electrode conn.</text></g><g class="c-teal"><rect x="505" y="56" width="125" height="238" rx="6" stroke-width="0.5"/><text class="th" x="567" y="74" text-anchor="middle" dominant-baseline="central">Test loops</text><text class="th" x="517" y="104" dominant-baseline="central">VP</text><text class="ts" x="517" y="120" dominant-baseline="central">C2 hot end</text><text class="th" x="517" y="144" dominant-baseline="central">VN</text><text class="ts" x="517" y="160" dominant-baseline="central">C3 hot end</text><text class="th" x="517" y="184" dominant-baseline="central">OUT</text><text class="ts" x="517" y="200" dominant-baseline="central">R7 top</text><text class="th" x="517" y="224" dominant-baseline="central">LOAD</text><text class="ts" x="517" y="240" dominant-baseline="central">R7 bottom</text><text class="th" x="517" y="264" dominant-baseline="central">REF</text><text class="ts" x="517" y="280" dominant-baseline="central">U1 pin 6</text></g><g class="c-teal"><rect x="210" y="186" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="270.0" y="199.0" text-anchor="middle" dominant-baseline="central">DG1022</text><text class="ts" x="270.0" y="218.0" text-anchor="middle" dominant-baseline="central">BNC, HiZ</text></g><g class="c-teal"><rect x="30" y="350" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="105.0" y="369.0" text-anchor="middle" dominant-baseline="central">Laptop</text><text class="ts" x="105.0" y="388.0" text-anchor="middle" dominant-baseline="central">bench_rig.py, USB</text></g><g class="c-gray"><rect x="380" y="350" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="435.0" y="369.0" text-anchor="middle" dominant-baseline="central">Load fixture</text><text class="ts" x="435.0" y="388.0" text-anchor="middle" dominant-baseline="central">RL, link, GND</text></g><g class="c-teal"><rect x="510" y="350" width="130" height="56" rx="6" stroke-width="0.5"/><text class="th" x="575.0" y="369.0" text-anchor="middle" dominant-baseline="central">DHO804</text><text class="ts" x="575.0" y="388.0" text-anchor="middle" dominant-baseline="central">4 × 10× probes</text></g><line x1="180" y1="70" x2="208" y2="70" stroke="#E24B4A" stroke-width="1.5"/><line x1="330" y1="70" x2="378" y2="70" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="106" x2="378" y2="106" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="142" x2="208" y2="142" stroke="#378ADD" stroke-width="1.5"/><line x1="330" y1="142" x2="378" y2="142" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" y1="208" x2="378" y2="208" class="arr" marker-end="url(#arrow)"/><path d="M105 350 L105 262 L270 262 L270 232" class="arr" fill="none" marker-end="url(#arrow)"/><path d="M105 406 L105 436 L575 436 L575 408" class="arr" fill="none" marker-end="url(#arrow)"/><line x1="430" y1="296" x2="430" y2="348" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="575" y1="348" x2="575" y2="296" class="arr" marker-end="url(#arrow)"/><text class="ts" x="30" y="468" dominant-baseline="central">Coral = power path (red +30 V, grey GND, blue −30 V). Teal = signal and measurement. Probe grounds on the fixture GND post.</text></svg>