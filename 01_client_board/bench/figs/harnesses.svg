<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 554" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Harness and fixture mockups</title><desc>Power harness from Micro-Fit plug to three banana plugs, load fixture with series link and ground post, and five test loop locations.</desc><style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:bold;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/><text class="th" x="30" y="30" dominant-baseline="central">A  Power harness: J3 → Xantrex (make 1)</text><g class="c-gray"><rect x="50" y="62" width="70" height="92" rx="4" stroke-width="0.5"/></g><text class="ts" x="85" y="52" text-anchor="middle" dominant-baseline="central">Micro-Fit plug</text><circle cx="104" cy="84" r="5" fill="none" stroke="#E24B4A" stroke-width="1.5"/><line x1="109" y1="84" x2="470" y2="84" stroke="#E24B4A" stroke-width="2"/><text class="ts" x="140" y="75" dominant-baseline="central">1  VCC+  red</text><rect x="470" y="78" width="38" height="12" rx="2" fill="#E24B4A" opacity="0.85"/><line x1="508" y1="84" x2="528" y2="84" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/><text class="ts" x="538" y="84" dominant-baseline="central">out1 +  (via Fluke 45)</text><circle cx="104" cy="108" r="5" fill="none" stroke="#444441" stroke-width="1.5"/><line x1="109" y1="108" x2="470" y2="108" stroke="#444441" stroke-width="2"/><text class="ts" x="140" y="99" dominant-baseline="central">2  GND  black</text><rect x="470" y="102" width="38" height="12" rx="2" fill="#444441" opacity="0.85"/><line x1="508" y1="108" x2="528" y2="108" stroke="#444441" stroke-width="3" stroke-linecap="round"/><text class="ts" x="538" y="108" dominant-baseline="central">out1 − + out2 + link</text><circle cx="104" cy="132" r="5" fill="none" stroke="#378ADD" stroke-width="1.5"/><line x1="109" y1="132" x2="470" y2="132" stroke="#378ADD" stroke-width="2"/><text class="ts" x="140" y="123" dominant-baseline="central">3  VCC−  blue</text><rect x="470" y="126" width="38" height="12" rx="2" fill="#378ADD" opacity="0.85"/><line x1="508" y1="132" x2="528" y2="132" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/><text class="ts" x="538" y="132" dominant-baseline="central">out2 −  (via BM235)</text><text class="ts" x="62" y="84" dominant-baseline="central">1</text><text class="ts" x="62" y="108" dominant-baseline="central">2</text><text class="ts" x="62" y="132" dominant-baseline="central">3</text><path d="M300 70 q10 14 20 0 q10 -14 20 0 q10 14 20 0" fill="none" stroke="#888780" stroke-width="0.8"/><text class="ts" x="372" y="62" dominant-baseline="central">~60 cm, twisted</text><text class="ts" x="50" y="176" dominant-baseline="central">4 mm banana plugs, GND one stackable. Ammeters sit between the Xantrex posts and the bananas, not in the harness.</text><text class="ts" x="50" y="194" dominant-baseline="central">Pinout from STIM.SchDoc: confirm by continuity J3 pin → F1 / F2 pad before first power. Or borrow the client's cable.</text><text class="th" x="30" y="230" dominant-baseline="central">B  Load fixture: J1 / J2 (make 2: 1.00 kΩ and 2.2 kΩ, 0.1 %)</text><g class="c-gray"><rect x="50" y="272" width="64" height="44" rx="6" stroke-width="0.5"/><text class="th" x="82.0" y="294.0" text-anchor="middle" dominant-baseline="central">J1 mate</text></g><line x1="114" y1="294" x2="170" y2="294" stroke="#444441" stroke-width="1.5"/><rect x="170" y="282" width="44" height="24" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/><circle cx="182" cy="294" r="3" fill="#412402"/><circle cx="202" cy="294" r="3" fill="#412402"/><text class="ts" x="192" y="270" text-anchor="middle" dominant-baseline="central">link</text><line x1="214" y1="294" x2="270" y2="294" stroke="#444441" stroke-width="1.5"/><path d="M270 294 l 8 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 5" fill="none" stroke="#444441" stroke-width="1.5"/><text class="ts" x="310" y="270" text-anchor="middle" dominant-baseline="central">RL</text><line x1="350" y1="294" x2="450" y2="294" stroke="#444441" stroke-width="1.5"/><g class="c-gray"><rect x="450" y="272" width="64" height="44" rx="6" stroke-width="0.5"/><text class="th" x="482.0" y="294.0" text-anchor="middle" dominant-baseline="central">J2 mate</text></g><line x1="410" y1="294" x2="410" y2="324" stroke="#444441" stroke-width="1.5"/><circle cx="410" cy="331" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="ts" x="424" y="334" dominant-baseline="central">GND post: 4 probe grounds + generator ground</text><line x1="242" y1="294" x2="242" y2="268" stroke="#444441" stroke-width="1.5"/><circle cx="242" cy="261" r="6" fill="none" stroke="#444441" stroke-width="1.5"/><text class="ts" x="252" y="250" dominant-baseline="central">LOAD tip (CH1)</text><text class="ts" x="192" y="324" text-anchor="middle" dominant-baseline="central">pull → Fluke 45 in series (A5b)</text><text class="ts" x="50" y="364" dominant-baseline="central">≥ 0.25 W. Write the measured RL on each fixture (--rl / --rl2). J1/J2 connector type: confirm with the client.</text><text class="th" x="30" y="404" dominant-baseline="central">C  Test loops: 30 AWG, tacked at home, only with the client's OK</text><rect x="74" y="464" width="32" height="7" rx="1" fill="#B4B2A9"/><line x1="90" y1="464" x2="90" y2="450" stroke="#444441" stroke-width="1.5"/><circle cx="90" cy="443" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="th" x="90" y="488" text-anchor="middle" dominant-baseline="central">VP</text><text class="ts" x="90" y="506" text-anchor="middle" dominant-baseline="central">C2 hot end</text><rect x="194" y="464" width="32" height="7" rx="1" fill="#B4B2A9"/><line x1="210" y1="464" x2="210" y2="450" stroke="#444441" stroke-width="1.5"/><circle cx="210" cy="443" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="th" x="210" y="488" text-anchor="middle" dominant-baseline="central">VN</text><text class="ts" x="210" y="506" text-anchor="middle" dominant-baseline="central">C3 hot end</text><rect x="314" y="464" width="32" height="7" rx="1" fill="#B4B2A9"/><line x1="330" y1="464" x2="330" y2="450" stroke="#444441" stroke-width="1.5"/><circle cx="330" cy="443" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="th" x="330" y="488" text-anchor="middle" dominant-baseline="central">OUT</text><text class="ts" x="330" y="506" text-anchor="middle" dominant-baseline="central">R7 top</text><rect x="434" y="464" width="32" height="7" rx="1" fill="#B4B2A9"/><line x1="450" y1="464" x2="450" y2="450" stroke="#444441" stroke-width="1.5"/><circle cx="450" cy="443" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="th" x="450" y="488" text-anchor="middle" dominant-baseline="central">LOAD</text><text class="ts" x="450" y="506" text-anchor="middle" dominant-baseline="central">R7 bottom</text><rect x="554" y="464" width="32" height="7" rx="1" fill="#B4B2A9"/><line x1="570" y1="464" x2="570" y2="450" stroke="#444441" stroke-width="1.5"/><circle cx="570" cy="443" r="7" fill="none" stroke="#444441" stroke-width="1.5"/><text class="th" x="570" y="488" text-anchor="middle" dominant-baseline="central">REF</text><text class="ts" x="570" y="506" text-anchor="middle" dominant-baseline="central">U1 pin 6</text><text class="ts" x="50" y="532" dominant-baseline="central">No permission → Pomona micro-grabbers on component ends, never on SOIC pins; tape the probe leads down.</text></svg>